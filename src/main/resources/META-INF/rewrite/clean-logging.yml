type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.cleanlogging.MigrateToSlf4jRecipe
displayName: Migrate all logging patterns to Lombok @Slf4j (all-in-one)
description: >-
  Single top-level recipe for codebases that have a MIX of logging patterns.
  Converts every pattern we support to Lombok @Slf4j in one pass:

  - System.out.println / System.err.println / printf → log.info / log.error
    with parameterized {} formatting.
  - Throwable.printStackTrace() → log.error("Exception occurred", e).
  - java.util.logging.Logger calls → log.xxx, with the JUL field and import
    removed.
  - Hand-rolled Log4j2 `Logger log = LogManager.getLogger(...)` fields →
    @Slf4j, with references renamed to `log` and the Log4j2 imports pruned.

  Also adds Lombok + SLF4J + Log4j2 backend dependencies (catalog-aware) and
  seeds production-ready log4j2.xml + console-only log4j2-test.xml. For
  codebases that only have ONE of these patterns, the focused recipes
  (`SystemOutToSlf4jRecipe`, `ConvertManualLoggerToSlf4jRecipe`) remain
  available and run faster.
tags:
  - logging
  - lombok
  - slf4j
  - log4j2
  - jul

recipeList:
  - io.github.fiftieshousewife.cleanlogging.AddSlf4jDependencies
  - io.github.fiftieshousewife.cleanlogging.CreateLog4j2Config
  # ConvertManualLoggerToSlf4j runs BEFORE JavaTransforms so a class that has
  # both a manual Log4j2 Logger field AND System.out calls gets its field
  # removed first; JavaTransforms' AddLombokSlf4jAnnotation would otherwise
  # see hasExplicitLoggerField() and skip the class entirely.
  - io.github.fiftieshousewife.cleanlogging.ConvertManualLoggerToSlf4j
  - io.github.fiftieshousewife.cleanlogging.JavaTransforms
  # After all conversions land on `log.X(...)` calls, parameterize any
  # remaining concatenated message strings (`log.info("user " + name)` →
  # `log.info("user {}", name)`). Hand-rolled (not upstream's
  # ParameterizedLogging) because upstream's UsesMethod precondition matches
  # by bound type — and our converted calls still carry the pre-conversion
  # logger type since OpenRewrite doesn't re-parse the LST mid-pipeline.
  - io.github.fiftieshousewife.cleanlogging.StringFormatInLogCall
  - io.github.fiftieshousewife.cleanlogging.Slf4jConcatToParameterized
  - io.github.fiftieshousewife.cleanlogging.ExplicitToStringInLogCall
  # Then drop trailing `{}` placeholders that consumed a Throwable arg —
  # `log.error("failed: {}", e)` → `log.error("failed", e)`. Without this
  # the throwable's stack trace is silently swallowed by SLF4J's toString
  # substitution. Runs after the parameterizer so concat-then-throwable
  # patterns get normalised first.
  - io.github.fiftieshousewife.cleanlogging.ThrowableLastArgumentNoPlaceholder
  - io.github.fiftieshousewife.cleanlogging.ThrowableGetMessageInPlaceholder

