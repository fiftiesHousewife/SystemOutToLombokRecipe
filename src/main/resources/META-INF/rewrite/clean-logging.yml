type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.cleanlogging.JavaTransforms
displayName: Apply @Slf4j annotation and convert System.out / printStackTrace / JUL calls
description: >-
  The Java-side transforms shared by the Lombok-based recipes: add @Slf4j
  to classes that use System.out, printStackTrace, or java.util.logging;
  convert System.out/err calls to log.info/log.error with parameterized
  formatting; convert printStackTrace to log.error; convert JUL level-named
  method calls (severe/warning/info/config/fine/finer/finest) to the
  equivalent log.xxx method and remove the now-unused JUL Logger field.

recipeList:
  - io.github.fiftieshousewife.cleanlogging.AddLombokSlf4jAnnotation
  - io.github.fiftieshousewife.cleanlogging.SystemOutToSlf4j
  - io.github.fiftieshousewife.cleanlogging.PrintStackTraceToLog
  - io.github.fiftieshousewife.cleanlogging.JulToSlf4j

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.cleanlogging.JavaTransformsClasspathGated
displayName: Apply @Slf4j / System.out / JUL conversions, gated on Lombok classpath
description: >-
  Same Java transforms as JavaTransforms, but @Slf4j is only added to source
  files whose classpath actually contains lombok.extern.slf4j.Slf4j. Use this
  from recipes that do NOT manage Lombok dependencies themselves, so classes
  in modules without Lombok aren't left with an @Slf4j that won't compile.

recipeList:
  - io.github.fiftieshousewife.cleanlogging.AddLombokSlf4jAnnotation:
      requireLombokOnClasspath: true
  - io.github.fiftieshousewife.cleanlogging.SystemOutToSlf4j:
      requireLombokOnClasspath: true
  - io.github.fiftieshousewife.cleanlogging.PrintStackTraceToLog:
      requireLombokOnClasspath: true
  - io.github.fiftieshousewife.cleanlogging.JulToSlf4j:
      requireLombokOnClasspath: true

