---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.CreateLog4j2Config
displayName: Create log4j2 main + test configurations
description: >
  Creates two log4j2 configurations:

  - `src/main/resources/log4j2.xml`: production-ready — non-error levels to
    stdout, errors to stderr, plus a rolling file appender under ./logs/ with
    daily + 10 MB rollover and gzip compression (keeps the 10 most recent).
  - `src/test/resources/log4j2-test.xml`: console only (no file rollover in
    tests). Log4j2 auto-discovers `log4j2-test.xml` on the test classpath and
    uses it in preference to the main config when tests run.

  Does nothing for files that already exist.

recipeList:
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/resources/log4j2.xml
      fileContents: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Configuration status="WARN">
            <Properties>
                <Property name="logPath">logs</Property>
                <Property name="logFile">app</Property>
                <Property name="pattern">%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n</Property>
            </Properties>
            <Appenders>
                <Console name="StdOut" target="SYSTEM_OUT">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="DENY" onMismatch="ACCEPT"/>
                </Console>
                <Console name="StdErr" target="SYSTEM_ERR">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="ACCEPT" onMismatch="DENY"/>
                </Console>
                <RollingFile name="RollingFile"
                             fileName="${logPath}/${logFile}.log"
                             filePattern="${logPath}/${logFile}-%d{yyyy-MM-dd}-%i.log.gz">
                    <PatternLayout pattern="${pattern}"/>
                    <Policies>
                        <TimeBasedTriggeringPolicy interval="1" modulate="true"/>
                        <SizeBasedTriggeringPolicy size="10 MB"/>
                    </Policies>
                    <DefaultRolloverStrategy max="10"/>
                </RollingFile>
            </Appenders>
            <Loggers>
                <Root level="info">
                    <AppenderRef ref="StdOut"/>
                    <AppenderRef ref="StdErr"/>
                    <AppenderRef ref="RollingFile"/>
                </Root>
            </Loggers>
        </Configuration>
      overwriteExisting: false

  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/test/resources/log4j2-test.xml
      fileContents: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Configuration status="WARN">
            <Properties>
                <Property name="pattern">%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n</Property>
            </Properties>
            <Appenders>
                <Console name="StdOut" target="SYSTEM_OUT">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="DENY" onMismatch="ACCEPT"/>
                </Console>
                <Console name="StdErr" target="SYSTEM_ERR">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="ACCEPT" onMismatch="DENY"/>
                </Console>
            </Appenders>
            <Loggers>
                <Root level="info">
                    <AppenderRef ref="StdOut"/>
                    <AppenderRef ref="StdErr"/>
                </Root>
            </Loggers>
        </Configuration>
      overwriteExisting: false

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.JavaTransforms
displayName: Apply @Log4j2 annotation and convert System.out / printStackTrace / JUL calls
description: >
  The Java-side transforms shared by the Lombok-based recipes: add @Log4j2
  to classes that use System.out, printStackTrace, or java.util.logging;
  convert System.out/err calls to log.info/log.error with parameterized
  formatting; convert printStackTrace to log.error; convert JUL level-named
  method calls (severe/warning/info/config/fine/finer/finest) to the
  equivalent log.xxx method and remove the now-unused JUL Logger field.

recipeList:
  - io.github.fiftieshousewife.recipes.AddLombokLog4j2Annotation
  - io.github.fiftieshousewife.recipes.SystemOutToLombokLog4j
  - io.github.fiftieshousewife.recipes.PrintStackTraceToLog
  - io.github.fiftieshousewife.recipes.JulToLombokLog4j

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.AddLombokLog4j2Dependencies
displayName: Add Lombok and Log4j2 dependencies (catalog-aware)
description: >
  Adds Lombok (compileOnly + annotationProcessor) and Log4j2 (api + core)
  dependencies to the build. If a Gradle version catalog
  (`gradle/libs.versions.toml`) is present, the entries are added to the
  catalog and the build.gradle.kts dependency declarations use libs.xxx
  references. Otherwise inline `"group:artifact:version"` declarations are
  added to build.gradle.kts.

recipeList:
  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: lombok
      versionValue: 1.18.44
      libraryAlias: lombok
      module: org.projectlombok:lombok

  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: log4jApi
      versionValue: 2.25.4
      libraryAlias: log4jApi
      module: org.apache.logging.log4j:log4j-api

  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: log4jCore
      versionValue: 2.25.4
      libraryAlias: log4jCore
      module: org.apache.logging.log4j:log4j-core

  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: compileOnly
      acceptTransitive: true

  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: annotationProcessor
      acceptTransitive: true

  - org.openrewrite.gradle.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-api
      version: 2.x
      configuration: implementation

  - org.openrewrite.gradle.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-core
      version: 2.x
      configuration: runtimeOnly

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.projectlombok:lombok
      catalogReference: libs.lombok

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.apache.logging.log4j:log4j-api
      catalogReference: libs.log4jApi

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.apache.logging.log4j:log4j-core
      catalogReference: libs.log4jCore

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.AddLombokDependency
displayName: Add Lombok dependency (catalog-aware)
description: >
  Adds only the Lombok compileOnly + annotationProcessor dependencies to the
  build. If a Gradle version catalog is present, the entry lands in the
  catalog and the build.gradle.kts declarations use `libs.lombok`. Otherwise
  inline declarations are added.

recipeList:
  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: lombok
      versionValue: 1.18.44
      libraryAlias: lombok
      module: org.projectlombok:lombok

  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: compileOnly
      acceptTransitive: true

  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: annotationProcessor
      acceptTransitive: true

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.projectlombok:lombok
      catalogReference: libs.lombok

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.SystemOutToLombokLog4jRecipe
displayName: Convert System.out to Lombok @Log4j2
description: >
  Converts System.out.println/printf, printStackTrace, and java.util.logging
  calls to Lombok @Log4j2 log statements. Auto-detects whether the project
  uses a Gradle version catalog: entries land in the catalog and references
  use `libs.xxx` when one is present, otherwise inline declarations are added
  to build.gradle.kts. Also creates a production-ready log4j2.xml plus a
  console-only log4j2-test.xml for tests.

recipeList:
  - io.github.fiftieshousewife.AddLombokLog4j2Dependencies
  - io.github.fiftieshousewife.CreateLog4j2Config
  - io.github.fiftieshousewife.JavaTransforms

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.SystemOutToLombokLog4jRecipeNoDeps
displayName: Convert System.out to Lombok @Log4j2 (no dependency management)
description: >
  Same Java transforms and log4j2.xml creation as SystemOutToLombokLog4jRecipe,
  but does NOT add any dependencies to your build. Use this variant when you
  manage dependencies yourself. You are responsible for adding Lombok
  (compileOnly + annotationProcessor) and log4j-api/log4j-core to your build
  before running this recipe.

recipeList:
  - io.github.fiftieshousewife.CreateLog4j2Config
  - io.github.fiftieshousewife.JavaTransforms

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.ConvertManualLog4j2ToLombokRecipe
displayName: Convert manual Log4j2 loggers to Lombok @Log4j2
description: >
  For codebases that already use Log4j2 but declare Logger fields manually
  (`private static final Logger log = LogManager.getLogger(X.class);`):
  replaces each manual field with Lombok's @Log4j2 annotation, renames
  references (logger/LOG/LOGGER → log), and adds the Lombok compileOnly +
  annotationProcessor dependencies. Catalog-aware: uses libs.lombok when
  a Gradle version catalog is present. Log4j2 API/core dependencies are
  expected to already be present.

recipeList:
  - io.github.fiftieshousewife.AddLombokDependency
  - io.github.fiftieshousewife.recipes.ConvertManualLog4j2ToLombok

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.ConvertManualLog4j2ToLombokRecipeNoDeps
displayName: Convert manual Log4j2 loggers to Lombok @Log4j2 (no dependency management)
description: >
  Same transformation as ConvertManualLog4j2ToLombokRecipe but without
  adding Lombok dependencies to the build. Use when you manage dependencies
  yourself (e.g. in a multi-module project where Lombok is already declared
  at a parent level).

recipeList:
  - io.github.fiftieshousewife.recipes.ConvertManualLog4j2ToLombok

