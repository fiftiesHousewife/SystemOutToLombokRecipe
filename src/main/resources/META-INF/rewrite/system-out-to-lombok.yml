---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.CreateLog4j2Config
displayName: Create log4j2 main + test configurations
description: >-
  Creates two log4j2 configurations:

  - `src/main/resources/log4j2.xml`: production-ready — non-error levels to
    stdout, errors to stderr, plus a rolling file appender under ./logs/ with
    daily + 10 MB rollover and gzip compression (keeps the 10 most recent).
  - `src/test/resources/log4j2-test.xml`: console only (no file rollover in
    tests). Log4j2 auto-discovers `log4j2-test.xml` on the test classpath and
    uses it in preference to the main config when tests run.

  Does nothing for files that already exist.

recipeList:
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/resources/log4j2.xml
      fileContents: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Configuration status="WARN">
            <Properties>
                <Property name="logPath">logs</Property>
                <Property name="logFile">app</Property>
                <Property name="pattern">%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n</Property>
            </Properties>
            <Appenders>
                <Console name="StdOut" target="SYSTEM_OUT">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="DENY" onMismatch="ACCEPT"/>
                </Console>
                <Console name="StdErr" target="SYSTEM_ERR">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="ACCEPT" onMismatch="DENY"/>
                </Console>
                <RollingFile name="RollingFile"
                             fileName="${logPath}/${logFile}.log"
                             filePattern="${logPath}/${logFile}-%d{yyyy-MM-dd}-%i.log.gz">
                    <PatternLayout pattern="${pattern}"/>
                    <Policies>
                        <TimeBasedTriggeringPolicy interval="1" modulate="true"/>
                        <SizeBasedTriggeringPolicy size="10 MB"/>
                    </Policies>
                    <DefaultRolloverStrategy max="10"/>
                </RollingFile>
            </Appenders>
            <Loggers>
                <Root level="info">
                    <AppenderRef ref="StdOut"/>
                    <AppenderRef ref="StdErr"/>
                    <AppenderRef ref="RollingFile"/>
                </Root>
            </Loggers>
        </Configuration>
      overwriteExisting: false

  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/test/resources/log4j2-test.xml
      fileContents: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Configuration status="WARN">
            <Properties>
                <Property name="pattern">%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n</Property>
            </Properties>
            <Appenders>
                <Console name="StdOut" target="SYSTEM_OUT">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="DENY" onMismatch="ACCEPT"/>
                </Console>
                <Console name="StdErr" target="SYSTEM_ERR">
                    <PatternLayout pattern="${pattern}"/>
                    <ThresholdFilter level="ERROR" onMatch="ACCEPT" onMismatch="DENY"/>
                </Console>
            </Appenders>
            <Loggers>
                <Root level="info">
                    <AppenderRef ref="StdOut"/>
                    <AppenderRef ref="StdErr"/>
                </Root>
            </Loggers>
        </Configuration>
      overwriteExisting: false

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.JavaTransforms
displayName: Apply @Slf4j annotation and convert System.out / printStackTrace / JUL calls
description: >-
  The Java-side transforms shared by the Lombok-based recipes: add @Slf4j
  to classes that use System.out, printStackTrace, or java.util.logging;
  convert System.out/err calls to log.info/log.error with parameterized
  formatting; convert printStackTrace to log.error; convert JUL level-named
  method calls (severe/warning/info/config/fine/finer/finest) to the
  equivalent log.xxx method and remove the now-unused JUL Logger field.

recipeList:
  - io.github.fiftieshousewife.recipes.AddLombokSlf4jAnnotation
  - io.github.fiftieshousewife.recipes.SystemOutToSlf4j
  - io.github.fiftieshousewife.recipes.PrintStackTraceToLog
  - io.github.fiftieshousewife.recipes.JulToSlf4j

---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.fiftieshousewife.AddSlf4jDependencies
displayName: Add Lombok, SLF4J API, and Log4j2 backend dependencies (catalog-aware)
description: >-
  Adds:

  - Lombok (`compileOnly` + `annotationProcessor`) — provides `@Slf4j`.
  - `slf4j-api` (`implementation`) — the logging facade the code will use.
  - `log4j-slf4j2-impl` (`runtimeOnly`) — routes SLF4J calls to Log4j2.
  - `log4j-core` (`runtimeOnly`) — the Log4j2 backend.

  If a Gradle version catalog (`gradle/libs.versions.toml`) is present, the
  entries are added to the catalog and `build.gradle.kts` uses `libs.xxx`
  references. Otherwise inline `"group:artifact:version"` declarations are
  added to `build.gradle.kts`.

recipeList:
  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: lombok
      versionValue: 1.18.44
      libraryAlias: lombok
      module: org.projectlombok:lombok

  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: slf4j
      versionValue: 2.0.17
      libraryAlias: slf4jApi
      module: org.slf4j:slf4j-api

  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: log4j
      versionValue: 2.25.4
      libraryAlias: log4jSlf4jImpl
      module: org.apache.logging.log4j:log4j-slf4j2-impl

  - io.github.fiftieshousewife.recipes.AddVersionCatalogEntry:
      versionAlias: log4j
      versionValue: 2.25.4
      libraryAlias: log4jCore
      module: org.apache.logging.log4j:log4j-core

  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.44
      configuration: compileOnly
      acceptTransitive: true

  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.44
      configuration: annotationProcessor
      acceptTransitive: true

  - org.openrewrite.gradle.AddDependency:
      groupId: org.slf4j
      artifactId: slf4j-api
      version: 2.0.17
      configuration: implementation

  - org.openrewrite.gradle.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-core
      version: 2.25.4
      configuration: runtimeOnly

  - org.openrewrite.gradle.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-slf4j2-impl
      version: 2.25.4
      configuration: runtimeOnly

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.projectlombok:lombok
      catalogReference: libs.lombok

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.slf4j:slf4j-api
      catalogReference: libs.slf4jApi

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.apache.logging.log4j:log4j-slf4j2-impl
      catalogReference: libs.log4jSlf4jImpl

  - io.github.fiftieshousewife.recipes.UseCatalogReferenceForDependency:
      module: org.apache.logging.log4j:log4j-core
      catalogReference: libs.log4jCore

---
