---
type: specs.openrewrite.org/v1beta/recipe
name: org.fifties.housewife.SystemOutToLombokLog4jRecipe
displayName: Convert System.out to Lombok @Log4j2
description: >
  Converts System.out.println/printf calls to Lombok @Log4j2 logging.
  This recipe adds the necessary Lombok and Log4j2 dependencies, adds the @Log4j2 annotation
  to classes with System.out calls, converts those calls to parameterized log statements,
  and creates a log4j2.xml configuration file.

recipeList:
  # Step 1: Add Lombok dependency (unconditionally)
  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: compileOnly
      acceptTransitive: true

  # Step 2: Add Lombok annotation processor (unconditionally)
  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: annotationProcessor
      acceptTransitive: true

  # Step 3: Add Log4j2 API dependency (unconditionally)
  - org.openrewrite.gradle.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-api
      version: 2.x
      configuration: implementation

  # Step 4: Add Log4j2 Core dependency (unconditionally)
  - org.openrewrite.gradle.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-core
      version: 2.x
      configuration: runtimeOnly

  # Step 5: Create log4j2.xml configuration file
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/resources/log4j2.xml
      fileContents: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Configuration status="WARN">
            <Appenders>
                <Console name="Console" target="SYSTEM_OUT">
                    <PatternLayout pattern="%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"/>
                </Console>
            </Appenders>
            <Loggers>
                <Root level="info">
                    <AppenderRef ref="Console"/>
                </Root>
            </Loggers>
        </Configuration>
      overwriteExisting: false

  # Step 6: Add @Log4j2 annotation to classes with System.out calls
  - org.fifties.housewife.recipes.AddLombokLog4j2Annotation

  # Step 7: Convert System.out calls to log statements
  - org.fifties.housewife.recipes.SystemOutToLombokLog4j

  # Step 8: Convert printStackTrace calls to log.error
  - org.fifties.housewife.recipes.PrintStackTraceToLog

---
type: specs.openrewrite.org/v1beta/recipe
name: org.fifties.housewife.SystemOutToLombokLog4jRecipeNoDeps
displayName: Convert System.out to Lombok @Log4j2 (no dependency management)
description: >
  Same Java transforms as SystemOutToLombokLog4jRecipe, but does NOT add Lombok or Log4j2
  dependencies to the build. Use this variant when you manage dependencies yourself — for
  example in a project that uses a Gradle version catalog (gradle/libs.versions.toml).
  You are responsible for adding Lombok (compileOnly + annotationProcessor) and
  log4j-api/log4j-core to your build before running this recipe.

recipeList:
  - org.openrewrite.text.CreateTextFile:
      relativeFileName: src/main/resources/log4j2.xml
      fileContents: |
        <?xml version="1.0" encoding="UTF-8"?>
        <Configuration status="WARN">
            <Appenders>
                <Console name="Console" target="SYSTEM_OUT">
                    <PatternLayout pattern="%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"/>
                </Console>
            </Appenders>
            <Loggers>
                <Root level="info">
                    <AppenderRef ref="Console"/>
                </Root>
            </Loggers>
        </Configuration>
      overwriteExisting: false

  - org.fifties.housewife.recipes.AddLombokLog4j2Annotation
  - org.fifties.housewife.recipes.SystemOutToLombokLog4j
  - org.fifties.housewife.recipes.PrintStackTraceToLog

---
type: specs.openrewrite.org/v1beta/recipe
name: org.fifties.housewife.AddLombokLog4j2Dependencies
displayName: Add Lombok and Log4j2 dependencies
description: Adds Lombok and Log4j2 dependencies to the project

recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      version: 1.18.x
      configuration: compileOnly
      acceptTransitive: true

  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-api
      version: 2.x
      configuration: implementation

  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.apache.logging.log4j
      artifactId: log4j-core
      version: 2.x
      configuration: implementation
