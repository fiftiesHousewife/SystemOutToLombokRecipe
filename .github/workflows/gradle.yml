# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    # Install both JDKs Gradle's toolchain auto-detection needs:
    # JDK 25 for the main project + the clean-code plugin (compiled at class
    # version 69), and JDK 21 as the launcher for the integrationTest +
    # smokeTest tasks (Gradle 8.14.3 daemons embedded by withToolingApi
    # and the smoke wrapper can't host JDK 25).
    - name: Set up JDKs 21 and 25
      uses: actions/setup-java@v4
      with:
        java-version: |
          21
          25
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    # Install both JDKs Gradle's toolchain auto-detection needs:
    # JDK 25 for the main project + the clean-code plugin (compiled at class
    # version 69), and JDK 21 as the launcher for the integrationTest +
    # smokeTest tasks (Gradle 8.14.3 daemons embedded by withToolingApi
    # and the smoke wrapper can't host JDK 25).
    - name: Set up JDKs 21 and 25
      uses: actions/setup-java@v4
      with:
        java-version: |
          21
          25
        distribution: 'temurin'
