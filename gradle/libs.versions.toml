[versions]
openrewrite = "7.26.0"
lombok = "1.18.42"
log4j = "2.25.3"
junit = "6.0.3"
assertj = "3.27.6"
jspecify = "1.0.0"

[libraries]
# OpenRewrite
openrewrite-java = { module = "org.openrewrite:rewrite-java" }
openrewrite-java17 = { module = "org.openrewrite:rewrite-java-17" }
openrewrite-test = { module = "org.openrewrite:rewrite-test" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Log4j2
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

# Testing
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# JSpecify for nullability annotations
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
openrewrite = { id = "org.openrewrite.rewrite", version.ref = "openrewrite" }
