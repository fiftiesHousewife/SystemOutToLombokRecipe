org.gradle.jvmargs=-Xmx2g --add-opens=java.base/java.lang=ALL-UNNAMED --enable-native-access=ALL-UNNAMED

# Knobs consumed by the recipe-library convention plugin (build-logic/).
# Java toolchain targets:
recipeLibrary.javaTargetMain=17
recipeLibrary.javaTargetTests=25

# Quality gates. Match the existing inline build's settings:
#   - 90% line coverage (clean-logging has historically enforced 90% via JaCoCo).
#   - SpotBugs strict (clean-logging had ignoreFailures=false).
# failOnStaleDependencies stays opt-out to avoid blocking the build on every
# upstream release.
recipeLibrary.minLineCoverage=0.90
recipeLibrary.spotbugsStrict=true
# recipeLibrary.failOnStaleDependencies=true
